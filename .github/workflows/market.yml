name: Intraday market pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Tradingdesk journal audit']
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/market.yml'
      - 'dist/**'
      - 'test_market_history.py'
      - 'session_feed.py'
      - 'correction_study/**'
      - 'snapshot.py'
      - 'test_intraday.cjs'
      - 'test_heat_paper.cjs'
      - 'package_panic.cjs'
      - 'tests/panic_navigation.py'
      - 'index.html'
      - 'round2_refresh.py'
      - 'test_round2_refresh.py'
  schedule:
    - cron: '7,37 7-21 * * 1-5'
permissions: {}
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  quotes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check dashboard and paper execution before publishing
        if: github.event_name != 'schedule'
        run: |
          python3 -m unittest correction_study.test_model test_market_history
          node --check dist/app.js
          node --check dist/market.js
          node test_intraday.cjs
          node --test test_heat_paper.cjs
          python3 -m py_compile snapshot.py session_feed.py round2_refresh.py
          python3 -m unittest test_round2_refresh
      - name: Identify published InvestorAce data
        id: archive
        run: |
          revision=$(git ls-remote --exit-code https://github.com/Usubillaga/InvestorAce.git refs/heads/main | cut -f1)
          test "${#revision}" = 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          bundled=$(python3 -c "import json; print(json.load(open('dist/snapshot.json'))['commit'])")
          if [ "$revision" != "$bundled" ] || ! python3 -c "import json; m=json.load(open('dist/snapshot.json'))['market']; assert all(row['date'] >= m['history'][row['symbol']][-1][0] for row in m['moves'])"; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        id: saved
        if: steps.archive.outputs.changed == 'true'
        with:
          path: cached-snapshot.json
          key: archive-v1-${{ hashFiles('snapshot.py') }}-${{ steps.archive.outputs.revision }}
      - name: Replay fresh data with the reviewed rule code
        if: steps.archive.outputs.changed == 'true' && steps.saved.outputs.cache-hit != 'true'
        env:
          DATA_REVISION: ${{ steps.archive.outputs.revision }}
          RULE_REVISION: 0957f422a4031b93eff5d46b4c9fc2b842b4e837
        run: |
          git clone --quiet --no-checkout https://github.com/Usubillaga/InvestorAce.git "$RUNNER_TEMP/ia-data"
          git -C "$RUNNER_TEMP/ia-data" checkout --quiet --detach "$DATA_REVISION"
          git -C "$RUNNER_TEMP/ia-data" worktree add --quiet --detach "$RUNNER_TEMP/ia-rules" "$RULE_REVISION"
          python3 -S snapshot.py "$RUNNER_TEMP/ia-data" --rules "$RUNNER_TEMP/ia-rules"
          cp dist/snapshot.json cached-snapshot.json
      - name: Use verified archive output
        if: steps.archive.outputs.changed == 'true'
        run: |
          cp cached-snapshot.json dist/snapshot.json
          python3 -c "import json; s=json.load(open('dist/snapshot.json')); assert s['current'] in s['builds'] and s['scorecard'] and s.get('market')"
      - name: Fetch public market prices using the Python standard library
        run: python3 session_feed.py
      - name: Refresh the round-two journal from the published InvestorAce report
        run: python3 round2_refresh.py
      - name: Package static web assets
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R dist _site/
          node package_panic.cjs _site/dist
      - name: Check native paper navigation on phone and desktop
        if: github.event_name != 'schedule'
        run: python3 tests/panic_navigation.py _site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  persist:
    if: github.ref == 'refs/heads/main'
    needs: quotes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.save.outputs.deploy }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - uses: actions/checkout@v4
        with:
          path: branch
          ref: ${{ github.sha }}
      - name: Persist the tested market files together
        id: save
        working-directory: branch
        env:
          GH_SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf ../artifact.tar ./dist/snapshot.json ./dist/quotes.json ./dist/positioning.json ./dist/paper-round2.json
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          def read(name):
              return json.loads(Path('dist', name + '.json').read_bytes())
          snapshot, feed = read('snapshot'), read('quotes')
          saved = json.loads(subprocess.check_output(['git', 'show', 'HEAD:dist/snapshot.json']))
          assert snapshot['current'] in snapshot['builds'] and snapshot['scorecard'] and snapshot['market']['moves']
          assert not any(issue['section'] == 'Build' for issue in snapshot['issues'])
          assert saved['current'] == snapshot['current'] or (saved['current'] in snapshot['builds'] and snapshot['captured'] > saved['captured'])
          assert feed['snapshot'] == snapshot['current'] and feed['quotes']
          PYTHON
          if [ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" != "$GH_SOURCE_SHA" ]; then
            echo "::notice::Main advanced while sampling. Leaving the newer site intact."
            exit 0
          fi
          git add -- dist/snapshot.json dist/quotes.json dist/positioning.json dist/paper-round2.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh verified market snapshot and session quotes'
            git push origin HEAD:refs/heads/main
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: persist
    if: needs.persist.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Delete the Pages artifact once deployed
        # This workflow deploys up to twice per hour on weekdays; each site
        # artifact (about 1 MB) would otherwise count against the account's
        # Actions storage until it expires.
        if: success()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
            for (const artifact of data.artifacts.filter(a => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
